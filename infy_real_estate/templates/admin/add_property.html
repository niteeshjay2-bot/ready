{% extends "base.html" %}
{% block title %}Add Property{% endblock %}

{% block content %}
<section class="section">
    <div class="container">
        <div class="page-header">
            <h1>Add New Property</h1>
        </div>
        <div class="form-card">
            <form method="POST" enctype="multipart/form-data" class="property-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <h3>Basic Information</h3>
                <div class="form-group">
                    <label>Title *</label>
                    <input type="text" name="title" required placeholder="Property title">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea name="description" rows="4" placeholder="Detailed description"></textarea>
                </div>
                <div class="form-row-3">
                    <div class="form-group">
                        <label>Property Type *</label>
                        <select name="property_type" required>
                            {% for ptype in property_types %}
                            <option value="{{ ptype }}">{{ ptype }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Price (INR) *</label>
                        <input type="number" name="price" required min="0">
                    </div>
                    <div class="form-group">
                        <label>Area (sq ft) *</label>
                        <input type="number" name="area_sqft" required min="0">
                    </div>
                </div>
                <div class="form-row-3">
                    <div class="form-group">
                        <label>Bedrooms</label>
                        <input type="number" name="bedrooms" value="2" min="0">
                    </div>
                    <div class="form-group">
                        <label>Bathrooms</label>
                        <input type="number" name="bathrooms" value="2" min="0">
                    </div>
                    <div class="form-group">
                        <label>Property Age (years)</label>
                        <input type="number" name="property_age" value="0" min="0">
                    </div>
                </div>
                <div class="form-row-3">
                    <div class="form-group">
                        <label>Floor Number</label>
                        <input type="number" name="floor_number" value="0" min="0">
                    </div>
                    <div class="form-group">
                        <label>Total Floors</label>
                        <input type="number" name="total_floors" value="1" min="1">
                    </div>
                    <div class="form-group">
                        <label>Facing</label>
                        <select name="facing">
                            <option value="">Select</option>
                            <option value="North">North</option>
                            <option value="South">South</option>
                            <option value="East">East</option>
                            <option value="West">West</option>
                            <option value="North-East">North-East</option>
                            <option value="South-West">South-West</option>
                        </select>
                    </div>
                </div>
                <div class="form-row-2">
                    <div class="form-group">
                        <label>Furnished</label>
                        <select name="furnished">
                            <option value="unfurnished">Unfurnished</option>
                            <option value="semi-furnished">Semi-Furnished</option>
                            <option value="furnished">Furnished</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Listing Type</label>
                        <select name="listing_type">
                            <option value="sale">For Sale</option>
                            <option value="rent">For Rent</option>
                        </select>
                    </div>
                </div>

                <h3>Location</h3>
                <div class="form-row-2">
                    <div class="form-group">
                        <label>State</label>
                        <select name="state_id" id="stateSelect">
                            <option value="">Select State</option>
                            {% for state in states %}
                            <option value="{{ state.id }}">{{ state.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>City *</label>
                        <select name="city_id" id="citySelect" required>
                            <option value="">Select City</option>
                        </select>
                    </div>
                </div>
                <div class="form-row-2">
                    <div class="form-group">
                        <label>Locality</label>
                        <input type="text" name="locality" placeholder="Area/Locality name">
                    </div>
                    <div class="form-group">
                        <label>Pincode</label>
                        <input type="text" name="pincode" placeholder="6-digit pincode">
                    </div>
                </div>
                <div class="form-group">
                    <label>Full Address</label>
                    <textarea name="address" rows="2" placeholder="Complete address"></textarea>
                </div>

                <h3>Amenities</h3>
                <div class="amenities-check-grid">
                    <label class="checkbox-label"><input type="checkbox" name="car_parking"> Car Parking</label>
                    <label class="checkbox-label"><input type="checkbox" name="swimming_pool"> Swimming Pool</label>
                    <label class="checkbox-label"><input type="checkbox" name="power_backup"> Power Backup</label>
                    <label class="checkbox-label"><input type="checkbox" name="lift"> Lift</label>
                    <label class="checkbox-label"><input type="checkbox" name="gym"> Gym</label>
                    <label class="checkbox-label"><input type="checkbox" name="club_house"> Club House</label>
                    <label class="checkbox-label"><input type="checkbox" name="garden"> Garden</label>
                    <label class="checkbox-label"><input type="checkbox" name="security"> Security</label>
                    <label class="checkbox-label"><input type="checkbox" name="children_play_area"> Play Area</label>
                    <label class="checkbox-label"><input type="checkbox" name="water_facility"> Water 24/7</label>
                    <label class="checkbox-label"><input type="checkbox" name="pet_friendly"> Pet Friendly</label>
                    <label class="checkbox-label"><input type="checkbox" name="near_school"> Near School</label>
                    <label class="checkbox-label"><input type="checkbox" name="near_hospital"> Near Hospital</label>
                    <label class="checkbox-label"><input type="checkbox" name="metro_connectivity"> Metro Connectivity</label>
                </div>

                <h3>Owner/Builder</h3>
                <div class="form-row-3">
                    <div class="form-group">
                        <label>Builder Name</label>
                        <input type="text" name="builder_name" placeholder="Builder/Developer name">
                    </div>
                    <div class="form-group">
                        <label>Owner Name</label>
                        <input type="text" name="owner_name" placeholder="Owner name">
                    </div>
                    <div class="form-group">
                        <label>Owner Phone</label>
                        <input type="text" name="owner_phone" placeholder="Contact number">
                    </div>
                </div>

                <h3>Images</h3>
                <div class="form-group">
                    <label>Property Images</label>
                    <input type="file" name="images" multiple accept="image/*">
                    <small>Upload property images (first image will be the main image)</small>
                </div>

                <div class="form-group">
                    <label class="checkbox-label"><input type="checkbox" name="is_featured"> Mark as Featured Property</label>
                </div>

                <button type="submit" class="btn btn-primary btn-lg">Add Property</button>
            </form>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('stateSelect').addEventListener('change', function() {
    var stateId = this.value;
    var citySelect = document.getElementById('citySelect');
    citySelect.innerHTML = '<option value="">Loading...</option>';
    if (stateId) {
        fetch('/api/cities/' + stateId)
        .then(function(r) { return r.json(); })
        .then(function(cities) {
            citySelect.innerHTML = '<option value="">Select City</option>';
            cities.forEach(function(c) {
                citySelect.innerHTML += '<option value="' + c.id + '">' + c.name + '</option>';
            });
        });
    } else {
        citySelect.innerHTML = '<option value="">Select City</option>';
    }
});
</script>
{% endblock %}
